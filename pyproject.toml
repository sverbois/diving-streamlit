[project]
name = "diving-streamlit"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "plotly>=7.2.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "streamlit[auth]>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.6",
    "watchdog>=7.1.1",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
isort.force-single-line = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
